# Application Configuration
quarkus.application.name=MailConfirm

# HTTP Configuration
quarkus.http.port=8080

# OpenAPI/Swagger Configuration
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.info.title=Email Verification API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API for email verification with opt-in confirmation
mp.openapi.extensions.smallrye.info.contact.name=Support Team

# Mailer Configuration
quarkus.mailer.from=noreply@mailconfirm.com
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.username=
quarkus.mailer.password=
quarkus.mailer.mock=false

# Application Base URL
app.base-url=http://localhost:8080

# Verification Token Configuration
verification.token.expiry-hours=24

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.emailverification".level=DEBUG
