services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailconfirm-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - mailconfirm-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mailconfirm-app
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_MAILER_HOST=mailhog
      - QUARKUS_MAILER_PORT=1025
      - APP_BASE_URL=http://localhost:8080
    depends_on:
      mailhog:
        condition: service_healthy
    networks:
      - mailconfirm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  mailconfirm-network:
    driver: bridge
